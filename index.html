<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Studio Pro | لوحة التحكم الكاملة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- استدعاء مكتبة الكيو آر المضمونة -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #0b1120; color: #f8fafc; }
    .checkerboard {
      background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%),
                        linear-gradient(-45deg, #1e293b 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #1e293b 75%),
                        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
  </style>
  <script>
    // نظام التوجيه الفوري عند مسح الكيو آر الديناميكي بالجوال
    (async function handleDynamicRedirect() {
      const params = new URLSearchParams(window.location.search);
      const qrId = params.get('id');
      if (!qrId) return;

      document.addEventListener('DOMContentLoaded', () => {
        document.body.innerHTML = `
          <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1120;color:#fff;font-family:'Cairo',sans-serif;text-align:center;padding:24px;">
            <div id="spinner" style="width:48px;height:48px;border:4px solid #6366f1;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px;"></div>
            <h2 id="titleText" style="font-size:20px;font-weight:bold;">جاري فتح المحتوى...</h2>
            <div id="contentBox" style="margin-top:16px;max-width:600px;width:100%;"></div>
            <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
          </div>
        `;
      });

      try {
        const res = await fetch('./links.json?t=' + Date.now(), { cache: 'no-store' });
        const links = await res.json();
        const item = links[qrId];

        if (!item) {
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('titleText').textContent = 'هذا الرمز غير مفعّل بعد';
          return;
        }

        const value = typeof item === 'string' ? item : item.value;
        const type = typeof item === 'string' ? 'url' : (item.type || 'url');

        if (type === 'text') {
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('titleText').textContent = 'المحتوى النصي:';
          document.getElementById('contentBox').innerHTML = `
            <div style="background:#1e293b;padding:20px;border-radius:16px;border:1px solid #334155;font-size:16px;line-height:1.8;white-space:pre-wrap;text-align:right;">${value}</div>
          `;
        } else {
          window.location.replace(value);
        }
      } catch (e) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('titleText').textContent = 'تعذر تحميل المحتوى';
      }
    })();
  </script>
</head>
<body class="min-h-screen p-4 md:p-8">

  <div class="max-w-7xl mx-auto">
    <header class="flex flex-wrap items-center justify-between gap-4 pb-6 mb-8 border-b border-slate-800">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold bg-gradient-to-l from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
          QR Studio Pro — لوحة التحكم الديناميكية
        </h1>
        <p class="text-slate-400 text-sm mt-1">صمم وادعم الروابط وملفات الـ PDF بدون تغيير شكل الكيو آر</p>
      </div>
      <button onclick="toggleTokenModal()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold px-4 py-2.5 rounded-xl flex items-center gap-2 transition">
        <span id="tokenStatusDot" class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
        <span id="tokenStatusText">إعداد مفتاح الحفظ المباشر (GitHub Token)</span>
      </button>
    </header>

    <!-- Modal Token -->
    <div id="tokenModal" class="hidden mb-6 bg-slate-900 border border-indigo-500/40 rounded-2xl p-5 space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-indigo-300">ربط الحفظ والرفع المباشر من داخل الموقع</h3>
        <button onclick="toggleTokenModal()" class="text-xs text-slate-400 hover:text-white">إغلاق ✕</button>
      </div>
      <p class="text-xs text-slate-400 leading-relaxed">ضع مفتاح GitHub Token الخاص بك هنا لتتمكن من التعديل والحفظ المباشر:</p>
      <div class="flex flex-wrap gap-2">
        <input id="ghTokenInput" type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
          class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-xs font-mono dir-ltr text-left" />
        <button onclick="saveGhToken()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-2.5 rounded-xl text-xs">
          حفظ المفتاح
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <!-- Controls -->
      <div class="lg:col-span-7 space-y-6">
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h2 class="text-lg font-bold text-indigo-400">1. التحكم بالمحتوى</h2>
            <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
              <button onclick="setQrMode('dynamic')" id="mode-dynamic" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white transition">ديناميكي ثات</button>
              <button onclick="setQrMode('direct')" id="mode-direct" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition">عادي مباشر</button>
            </div>
          </div>

          <div id="dynamicIdSection" class="bg-slate-950 border border-indigo-500/30 rounded-xl p-4 space-y-3">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-end">
              <div>
                <label class="text-xs text-slate-400 font-semibold block mb-1">اسم الكود الثابت (ID):</label>
                <input id="dynamicShortId" type="text" value="PRO-101" oninput="onShortIdChange()"
                  class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono text-amber-300 text-center dir-ltr" />
              </div>
              <div class="md:col-span-2">
                <label class="text-xs text-slate-400 block mb-1">الأكواد المحفوظة:</label>
                <div id="savedIdsList" class="flex flex-wrap gap-1.5 min-h-[36px] items-center bg-slate-900 p-1.5 rounded-lg border border-slate-800">
                  <span class="text-xs text-slate-500 px-2">جاري التحميل...</span>
                </div>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800">
            <button onclick="setContentType('url')" id="tab-url" class="py-2 rounded-lg text-xs md:text-sm font-bold bg-indigo-600 text-white transition">🔗 رابط</button>
            <button onclick="setContentType('pdf')" id="tab-pdf" class="py-2 rounded-lg text-xs md:text-sm font-bold text-slate-400 hover:text-white transition">📄 ملف PDF</button>
            <button onclick="setContentType('text')" id="tab-text" class="py-2 rounded-lg text-xs md:text-sm font-bold text-slate-400 hover:text-white transition">📝 نص</button>
          </div>

          <div id="content-url" class="space-y-2">
            <label class="text-xs text-slate-300 font-semibold block">الرابط:</label>
            <input id="targetUrlInput" type="url" value="https://google.com" oninput="updateQR()"
              class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white dir-ltr text-left" />
          </div>

          <div id="content-pdf" class="hidden space-y-3 bg-slate-950 p-4 rounded-xl border border-slate-800">
            <label class="text-xs text-slate-300 font-semibold block">رابط ملف الـ PDF (أو ارفعه في Releases):</label>
            <input id="pdfUrlInput" type="url" placeholder="https://..." oninput="updateQR()"
              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-emerald-300 font-mono dir-ltr text-left" />
          </div>

          <div id="content-text" class="hidden space-y-2">
            <label class="text-xs text-slate-300 font-semibold block">النص:</label>
            <textarea id="targetTextInput" rows="3" oninput="updateQR()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white"></textarea>
          </div>

          <div id="saveDynamicBox">
            <button onclick="saveDynamicLinkToGithub()" id="saveDynamicBtn"
              class="w-full bg-gradient-to-l from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-extrabold py-3.5 rounded-xl text-sm transition">
              💾 حفظ وتثبيت المحتوى الجديد في الموقع
            </button>
            <p id="saveStatusMsg" class="text-xs text-center mt-2 hidden"></p>
          </div>
        </section>

        <!-- Colors & Customization -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
          <h2 class="text-lg font-bold text-indigo-400">2. الألوان والأمامية</h2>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="text-xs text-slate-400 block mb-1">لون الـ QR:</label>
              <input id="qrColor" type="color" value="#000000" onchange="updateQR()" class="w-full h-10 bg-slate-950 rounded-xl cursor-pointer" />
            </div>
            <div>
              <label class="text-xs text-slate-400 block mb-1">لون الخلفية:</label>
              <input id="bgColor" type="color" value="#ffffff" onchange="updateQR()" class="w-full h-10 bg-slate-950 rounded-xl cursor-pointer" />
            </div>
          </div>
          <label class="flex items-center gap-2 text-sm text-slate-200 cursor-pointer pt-2">
            <input id="transparentBg" type="checkbox" onchange="updateQR()" class="w-4 h-4 accent-indigo-600 rounded" />
            <span>خلفية شفافة بالكامل (بدون مربع خلفية)</span>
          </label>
        </section>
      </div>

      <!-- Preview Column -->
      <div class="lg:col-span-5 space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sticky top-6 space-y-5">
          <h2 class="text-lg font-bold text-white">المعاينة الحية الصافية</h2>
          <div class="checkerboard rounded-2xl p-6 flex items-center justify-center min-h-[300px] border border-slate-800">
            <div id="
